404: Not Foundo Render

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deployment
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "Triggering Render deployment..."
            curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
              -H "Content-Type: application/json" \
              -w "\nHTTP Status: %{http_code}\n" \
              -s -o /dev/null
            echo "Render deployment triggered successfully!"
          else
            echo "RENDER_DEPLOY_HOOK_URL secret not set. Skipping Render deploy trigger."
            echo "To enable: Go to Render dashboard → Service → Settings → Deploy Hook"
            echo "Copy the URL and add it as RENDER_DEPLOY_HOOK_URL in GitHub Secrets."
          fi
